<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="javaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141a24" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="500" rx="16" fill="url(#javaBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#222c3d" stroke-width="1.5" />

  <!-- App Header -->
  <rect x="0" y="0" width="800" height="48" rx="16" fill="#10151f" />
  <circle cx="28" cy="24" r="6" fill="#ef4444" />
  <circle cx="48" cy="24" r="6" fill="#f59e0b" />
  <circle cx="68" cy="24" r="6" fill="#10b981" />
  <text x="400" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" text-anchor="middle">Student Enrollment &amp; Fee Management — Java OOP Console Prototype</text>

  <!-- Left: Authentic Java Terminal Simulation -->
  <g transform="translate(30, 70)">
    <rect width="420" height="400" rx="12" fill="#080c12" stroke="#223044" stroke-width="1.5" />
    
    <!-- Terminal Titlebar -->
    <rect x="1" y="1" width="418" height="32" rx="11" fill="#121822" />
    <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">&gt;_ bash — java -cp bin com.enrollment.Application</text>

    <!-- Terminal Output -->
    <g transform="translate(16, 50)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">
      <text y="0" fill="#64748b">===================================================</text>
      <text y="16" font-weight="bold" fill="#38bdf8">  PSTU CSE STUDENT ENROLLMENT &amp; FEE SYSTEM (JAVA)  </text>
      <text y="32" fill="#64748b">===================================================</text>

      <text y="54" fill="#d4ff3a">[AUTH] Select Access Role:</text>
      <text y="70" fill="#e2e8f0">  1. Student Self-Service Portal</text>
      <text y="86" fill="#e2e8f0">  2. Cashier Fee Clearance Desk</text>
      <text y="102" fill="#e2e8f0">  3. System Administrator Console</text>
      <text y="118" fill="#94a3b8">  0. Exit System</text>
      <text y="138" fill="#38bdf8">&gt; Selected: [1] Student Portal</text>

      <!-- Student details section -->
      <text y="160" fill="#64748b">---------------------------------------------------</text>
      <text y="176" fill="#f8fafc">Student: Tanvir Anjum | ID: 2302042 | Sem: 3</text>
      <text y="192" fill="#4ade80">Academic CGPA: 3.820 (Merit Waiver Tier 1: 25%)</text>
      <text y="208" fill="#e2e8f0">Base Semester Fee:   BDT 12,000.00</text>
      <text y="224" fill="#fbbf24">CGPA Waiver (-25%): -BDT  3,000.00</text>
      <text y="240" font-weight="bold" fill="#d4ff3a">Net Payable Amount:  BDT  9,000.00</text>
      <text y="256" fill="#64748b">---------------------------------------------------</text>

      <text y="278" fill="#38bdf8">&gt; Requesting cashier clearance token...</text>
      <text y="296" fill="#4ade80">&#10003; Transaction Record Generated: TXN-2026-8819</text>
      <text y="314" fill="#94a3b8">Status: PENDING CASHIER APPROVAL &#8226; Receipt Ready</text>
      
      <!-- Blinking cursor -->
      <text y="336" fill="#d4ff3a">&gt; Press [Enter] to continue... &#9608;</text>
    </g>
  </g>

  <!-- Right: Architecture & OOP Model Visuals -->
  <g transform="translate(470, 70)">
    <rect width="300" height="400" rx="12" fill="#0f141d" stroke="#223044" stroke-width="1.5" />

    <!-- OOP Architecture Title -->
    <g transform="translate(16, 18)">
      <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#38bdf8">OOP CLASS HIERARCHY</text>
      <line x1="0" y1="26" x2="268" y2="26" stroke="#223044" stroke-width="1" />
    </g>

    <!-- Base Abstract Class -->
    <g transform="translate(16, 56)">
      <rect width="268" height="42" rx="6" fill="#151e2b" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">&lt;&lt;abstract&gt;&gt;</text>
      <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#f8fafc">User (id, name, role)</text>
    </g>

    <!-- Inheritance arrows -->
    <path d="M 150 98 L 150 114 M 60 114 L 240 114 M 60 114 L 60 126 M 150 114 L 150 126 M 240 114 L 240 126" fill="none" stroke="#334155" stroke-width="1.5" />

    <!-- Subclasses -->
    <g transform="translate(16, 126)">
      <!-- Student -->
      <rect x="0" y="0" width="82" height="44" rx="4" fill="#161c27" stroke="#25354a" stroke-width="1" />
      <text x="41" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#d4ff3a" text-anchor="middle">Student</text>
      <text x="41" y="34" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8" text-anchor="middle">FeeReq</text>

      <!-- Cashier -->
      <rect x="93" y="0" width="82" height="44" rx="4" fill="#161c27" stroke="#25354a" stroke-width="1" />
      <text x="134" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#14b8a6" text-anchor="middle">Cashier</text>
      <text x="134" y="34" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Approve</text>

      <!-- Admin -->
      <rect x="186" y="0" width="82" height="44" rx="4" fill="#161c27" stroke="#25354a" stroke-width="1" />
      <text x="227" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">Admin</text>
      <text x="227" y="34" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Manage</text>
    </g>

    <!-- Services & Features Box -->
    <g transform="translate(16, 186)">
      <rect width="268" height="110" rx="8" fill="#131924" stroke="#222e40" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f8fafc">SYSTEM CAPABILITIES</text>
      <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">&#10003; CGPA-Based Fee Reductions</text>
      <text x="12" y="54" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">&#10003; Cashier Receipt Generation</text>
      <text x="12" y="70" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">&#10003; CSV Report Data Export</text>
      <text x="12" y="86" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">&#10003; Custom Exception Hierarchy</text>
      <text x="12" y="102" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Polymorphism &#8226; Encapsulation &#8226; Robust CLI</text>
    </g>

    <!-- Academic Prototype Notice -->
    <g transform="translate(16, 310)">
      <rect width="268" height="74" rx="6" fill="#10151f" stroke="#1d2636" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">PROTOTYPE SCOPE NOTICE</text>
      <text x="12" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Console-based academic Java project.</text>
      <text x="12" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Uses in-memory data structures &amp; CSV.</text>
      <text x="12" y="66" font-family="'JetBrains Mono', monospace" font-size="9" fill="#d4ff3a">Java 17+ &#8226; Object-Oriented Design</text>
    </g>
  </g>
</svg>