<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Frame Background (Editorial Monochrome) -->
  <rect width="800" height="500" rx="12" fill="#0B0B0C" />
  <rect x="1" y="1" width="798" height="498" rx="11" fill="none" stroke="#252528" stroke-width="1.5" />

  <!-- App Header -->
  <rect x="0" y="0" width="800" height="46" rx="12" fill="#141416" />
  <line x1="0" y1="46" x2="800" y2="46" stroke="#252528" stroke-width="1" />
  <circle cx="28" cy="23" r="5" fill="#E3343F" />
  <circle cx="46" cy="23" r="5" fill="#424242" />
  <circle cx="64" cy="23" r="5" fill="#252528" />
  <text x="400" y="27" font-family="'JetBrains Mono', monospace" font-size="11" fill="#858585" text-anchor="middle" letter-spacing="0.5">STUDENT ENROLLMENT &amp; FEE MANAGEMENT // JAVA OOP CONSOLE SYSTEM</text>

  <!-- Left: Authentic Java Terminal Simulation -->
  <g transform="translate(32, 66)">
    <rect width="410" height="404" rx="8" fill="#141416" stroke="#252528" stroke-width="1" />

    <!-- Terminal Titlebar -->
    <rect x="1" y="1" width="408" height="32" rx="7" fill="#1F1F22" />
    <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#858585">&gt;_ java -cp out Main</text>

    <!-- Terminal Output -->
    <g transform="translate(16, 48)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">
      <text y="14" fill="#858585">---------------------------------------------------</text>
      <text y="28" font-weight="bold" fill="#FFFFFF">  PSTU CSE STUDENT ENROLLMENT &amp; FEE SYSTEM (JAVA)  </text>
      <text y="42" fill="#858585">---------------------------------------------------</text>

      <text y="64" fill="#FFFFFF">[AUTH] Select Access Role:</text>
      <text y="80" fill="#F5F5F2">  1. Student Self-Service Portal</text>
      <text y="96" fill="#F5F5F2">  2. Cashier Fee Clearance Desk</text>
      <text y="112" fill="#F5F5F2">  3. System Administrator Console</text>
      <text y="128" fill="#858585">  0. Exit System</text>
      <text y="148" fill="#E3343F">&gt; Selected: [1] Student Portal</text>

      <!-- Student details section -->
      <text y="170" fill="#858585">---------------------------------------------------</text>
      <text y="186" fill="#FFFFFF">Student: Tanvir Anjum | ID: 2302042 | Sem: 3</text>
      <text y="202" fill="#E3343F">Academic CGPA: 3.820 (Dean's Merit Waiver Tier 1)</text>
      <text y="218" fill="#F5F5F2">Base Semester Fee:   BDT 12,000.00</text>
      <text y="234" fill="#858585">Merit Waiver (-25%): -BDT  3,000.00</text>
      <text y="250" font-weight="bold" fill="#FFFFFF">Net Payable Amount:  BDT  9,000.00</text>
      <text y="266" fill="#858585">---------------------------------------------------</text>

      <text y="288" fill="#E3343F">&gt; Requesting cashier clearance token...</text>
      <text y="304" fill="#FFFFFF">[OK] Token Generated: #TXN-2024-8841-CLR</text>
      <text y="320" fill="#858585">&gt; Generated: reports/students_report.txt [EXPORTED]</text>
    </g>
  </g>

  <!-- Right: OOP Hierarchy & Class Diagram -->
  <g transform="translate(460, 66)">
    <rect width="308" height="404" rx="8" fill="#141416" stroke="#252528" stroke-width="1" />
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#FFFFFF">OOP CLASS ARCHITECTURE</text>
    <text x="16" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">INHERITANCE, ENCAPSULATION &amp; POLYMORPHISM</text>

    <!-- Base Abstract Class: Person -->
    <g transform="translate(16, 62)">
      <rect width="276" height="66" rx="6" fill="#0B0B0C" stroke="#252528" stroke-width="1" />
      <rect width="276" height="24" rx="6" fill="#1F1F22" />
      <text x="138" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">&lt;&lt;abstract&gt;&gt; Person</text>
      <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="8" fill="#858585">- id: String, - name: String, - email: String</text>
      <text x="12" y="52" font-family="'JetBrains Mono', monospace" font-size="8" fill="#858585">+ displayDetails(): void</text>
    </g>

    <!-- Branch lines -->
    <line x1="84" y1="128" x2="84" y2="152" stroke="#424242" stroke-width="1" />
    <line x1="220" y1="128" x2="220" y2="152" stroke="#424242" stroke-width="1" />
    <line x1="84" y1="152" x2="220" y2="152" stroke="#424242" stroke-width="1" />
    <line x1="154" y1="128" x2="154" y2="152" stroke="#424242" stroke-width="1" />

    <!-- Subclass 1: Student -->
    <g transform="translate(16, 160)">
      <rect width="130" height="72" rx="4" fill="#0B0B0C" stroke="#E3343F" stroke-width="1" />
      <rect width="130" height="20" rx="4" fill="#1F1F22" />
      <text x="65" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#E3343F" text-anchor="middle">Student</text>
      <text x="8" y="34" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#858585">- cgpa: double</text>
      <text x="8" y="46" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#858585">- semester: int</text>
      <text x="8" y="58" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#FFFFFF">+ calculateFee()</text>
    </g>

    <!-- Subclass 2: Admin -->
    <g transform="translate(162, 160)">
      <rect width="130" height="72" rx="4" fill="#0B0B0C" stroke="#252528" stroke-width="1" />
      <rect width="130" height="20" rx="4" fill="#1F1F22" />
      <text x="65" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Administrator</text>
      <text x="8" y="34" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#858585">- department: String</text>
      <text x="8" y="46" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#858585">- clearancePin: int</text>
      <text x="8" y="58" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#FFFFFF">+ generateReceipt()</text>
    </g>

    <!-- Interface: FeePayable -->
    <g transform="translate(16, 246)">
      <rect width="276" height="56" rx="4" fill="#0B0B0C" stroke="#252528" stroke-width="1" />
      <text x="138" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585" text-anchor="middle">&lt;&lt;interface&gt;&gt; FeePayable</text>
      <text x="12" y="34" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFFFFF">+ computeTuitionWaiver(double cgpa): double</text>
      <text x="12" y="46" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFFFFF">+ getOutstandingBalance(): double</text>
    </g>

    <!-- Report & CSV Export Box -->
    <g transform="translate(16, 314)">
      <rect width="276" height="74" rx="4" fill="#1F1F22" stroke="#252528" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#FFFFFF">REPORT &amp; RECEIPT GENERATION &#8226; CSV</text>
      <text x="12" y="34" font-family="'JetBrains Mono', monospace" font-size="8" fill="#858585">&#8226; Plain-text transaction receipts with unique IDs</text>
      <text x="12" y="48" font-family="'JetBrains Mono', monospace" font-size="8" fill="#858585">&#8226; Student payment report generation</text>
      <text x="12" y="62" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E3343F">&#8226; Administrative student list CSV export</text>
    </g>
  </g>
</svg>
