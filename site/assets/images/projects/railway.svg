<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Frame Background (Editorial Monochrome) -->
  <rect width="800" height="500" rx="12" fill="#0B0B0C" />
  <rect x="1" y="1" width="798" height="498" rx="11" fill="none" stroke="#252528" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="46" rx="12" fill="#141416" />
  <line x1="0" y1="46" x2="800" y2="46" stroke="#252528" stroke-width="1" />
  <circle cx="28" cy="23" r="5" fill="#E3343F" />
  <circle cx="46" cy="23" r="5" fill="#424242" />
  <circle cx="64" cy="23" r="5" fill="#252528" />
  <text x="400" y="27" font-family="'JetBrains Mono', monospace" font-size="11" fill="#858585" text-anchor="middle" letter-spacing="0.5">SMART RAILWAY TRACK HEALTH &amp; SIGNALING // ESP32 ARCHITECTURE</text>

  <!-- Left: ESP32 Microcontroller Node -->
  <rect x="36" y="70" width="280" height="400" rx="8" fill="#141416" stroke="#252528" stroke-width="1" />
  <rect x="52" y="88" width="248" height="36" rx="6" fill="#1F1F22" stroke="#252528" stroke-width="1" />
  <text x="176" y="111" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ESP32 &#8226; TELEMETRY NODE</text>

  <!-- Ultrasonic Sensor Module -->
  <g transform="translate(52, 138)">
    <rect width="248" height="60" rx="6" fill="#0B0B0C" stroke="#252528" stroke-width="1" />
    <circle cx="28" cy="30" r="14" fill="#141416" stroke="#E3343F" stroke-width="1.5" />
    <circle cx="62" cy="30" r="14" fill="#141416" stroke="#E3343F" stroke-width="1.5" />
    <text x="90" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#FFFFFF">HC-SR04 Transducer</text>
    <text x="90" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">Obstacle Detection &#8226; 40kHz</text>
    <text x="236" y="34" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#E3343F" text-anchor="end">ARMED</text>
  </g>

  <!-- Telemetry OLED Display -->
  <g transform="translate(52, 212)">
    <rect width="248" height="82" rx="6" fill="#0B0B0C" stroke="#424242" stroke-width="1" />
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#858585">TRACK: KM-142.8 &#8226; NORTHBOUND</text>
    <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#FFFFFF">STATUS: OBSTACLE DETECTED</text>
    <text x="14" y="68" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#E3343F">RANGE: 1.84m &#8226; BRAKE ACTIVE</text>
  </g>

  <!-- GSM & GPS Transmission Module -->
  <g transform="translate(52, 308)">
    <rect width="248" height="68" rx="6" fill="#0B0B0C" stroke="#252528" stroke-width="1" />
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FFFFFF">SIM800L GSM / GPS UNIT</text>
    <text x="14" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">Lat 22.3592&#176; N, Lon 90.3804&#176; E</text>
    <text x="14" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E3343F">SMS Alert Dispatched &#8226; Control Room</text>
  </g>

  <!-- Power & Diagnostics Footer -->
  <rect x="52" y="390" width="248" height="60" rx="6" fill="#1F1F22" stroke="#252528" stroke-width="1" />
  <text x="66" y="412" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">POWER SUPPLY: 3.7V Li-Ion &#8226; LM2596 Reg</text>
  <text x="66" y="432" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#F5F5F2">System Heartbeat: 100ms Tick Rate</text>

  <!-- Right: Schematic Rail & Sensor Array Diagram -->
  <rect x="332" y="70" width="432" height="400" rx="8" fill="#141416" stroke="#252528" stroke-width="1" />
  <text x="354" y="100" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#FFFFFF">PHYSICAL TRACK SENSING MATRIX &#8226; SCHEMATIC</text>
  <text x="354" y="118" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">VIBRATION PIEZO SENSOR + DUAL OPTICAL BEAMS</text>

  <!-- Dual Railway Tracks (Monochrome) -->
  <g transform="translate(354, 150)">
    <!-- Rail Sleepers (Ties) -->
    <rect x="30" y="30" width="340" height="12" rx="2" fill="#1F1F22" stroke="#252528" stroke-width="1" />
    <rect x="30" y="70" width="340" height="12" rx="2" fill="#1F1F22" stroke="#252528" stroke-width="1" />
    <rect x="30" y="110" width="340" height="12" rx="2" fill="#1F1F22" stroke="#252528" stroke-width="1" />
    <rect x="30" y="150" width="340" height="12" rx="2" fill="#1F1F22" stroke="#252528" stroke-width="1" />
    <rect x="30" y="190" width="340" height="12" rx="2" fill="#1F1F22" stroke="#252528" stroke-width="1" />
    <rect x="30" y="230" width="340" height="12" rx="2" fill="#1F1F22" stroke="#252528" stroke-width="1" />

    <!-- Left Rail -->
    <rect x="90" y="10" width="16" height="250" rx="2" fill="#252528" stroke="#424242" stroke-width="1" />
    <!-- Right Rail -->
    <rect x="290" y="10" width="16" height="250" rx="2" fill="#252528" stroke="#424242" stroke-width="1" />

    <!-- Vibration Sensor Point on Left Rail -->
    <circle cx="98" cy="90" r="8" fill="#141416" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="98" cy="90" r="4" fill="#E3343F" />
    <text x="98" y="75" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585" text-anchor="middle">Piezo Sensor A</text>

    <!-- Ultrasonic Sensing Beam (Red Cone) -->
    <polygon points="198,10 120,180 276,180" fill="#E3343F" opacity="0.15" />
    <line x1="198" y1="10" x2="120" y2="180" stroke="#E3343F" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="198" y1="10" x2="276" y2="180" stroke="#E3343F" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Obstacle Indicator -->
    <rect x="180" y="165" width="36" height="30" rx="4" fill="#E3343F" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="198" y="184" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text>
    <text x="198" y="210" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#E3343F" text-anchor="middle">OBSTACLE AT 1.84m</text>
  </g>

  <!-- Bottom Diagnostic Bar -->
  <g transform="translate(354, 430)">
    <rect width="390" height="28" rx="4" fill="#0B0B0C" stroke="#252528" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#E3343F" />
    <text x="28" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F5F5F2">LATENCY: 18ms &#8226; ALARM SIGNAL LEVEL: CRITICAL &#8226; RELAY: TRIPPED</text>
  </g>
</svg>
