<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Frame Background (Editorial Monochrome) -->
  <rect width="800" height="500" rx="12" fill="#0B0B0C" />
  <rect x="1" y="1" width="798" height="498" rx="11" fill="none" stroke="#252528" stroke-width="1.5" />

  <!-- App Header -->
  <rect x="0" y="0" width="800" height="46" rx="12" fill="#141416" />
  <line x1="0" y1="46" x2="800" y2="46" stroke="#252528" stroke-width="1" />
  <circle cx="28" cy="23" r="5" fill="#E3343F" />
  <circle cx="46" cy="23" r="5" fill="#424242" />
  <circle cx="64" cy="23" r="5" fill="#252528" />
  <text x="400" y="27" font-family="'JetBrains Mono', monospace" font-size="11" fill="#858585" text-anchor="middle" letter-spacing="0.5">NAS SYNC MINI SERVER // ESP32 HTTP FILE &amp; MEDIA SERVER</text>

  <!-- Left: ESP32 Hardware Schematic -->
  <g transform="translate(32, 66)">
    <rect width="280" height="404" rx="8" fill="#141416" stroke="#252528" stroke-width="1" />

    <!-- Title banner -->
    <rect x="16" y="16" width="248" height="34" rx="4" fill="#1F1F22" stroke="#252528" stroke-width="1" />
    <text x="140" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ESP32 EMBEDDED HOST</text>

    <!-- microSD Card Storage Block -->
    <g transform="translate(16, 62)">
      <rect width="248" height="64" rx="6" fill="#0B0B0C" stroke="#252528" stroke-width="1" />
      <rect x="12" y="14" width="28" height="36" rx="2" fill="#141416" stroke="#E3343F" stroke-width="1.5" />
      <text x="50" y="30" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#FFFFFF">microSD Storage</text>
      <text x="50" y="46" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">SPI Interface &#8226; FAT32</text>
      <text x="236" y="38" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#E3343F" text-anchor="end">32 GB</text>
    </g>

    <!-- 0.96" OLED Simulation -->
    <g transform="translate(16, 138)">
      <rect width="248" height="82" rx="6" fill="#0B0B0C" stroke="#424242" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">OLED 128x64 &#8226; SSD1306 I2C</text>
      <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#FFFFFF">IP: 192.168.1.142</text>
      <text x="12" y="56" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E3343F">FILES: 128 | USED: 14.2 GB</text>
      <text x="12" y="72" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">PORT: 80 &#8226; STATUS: 200 OK</text>
    </g>

    <!-- DHT11 Sensor Block -->
    <g transform="translate(16, 232)">
      <rect width="248" height="64" rx="6" fill="#0B0B0C" stroke="#252528" stroke-width="1" />
      <text x="12" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FFFFFF">DHT11 TELEMETRY</text>
      <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">Ambient Temp: 28.4&#176;C &#8226; Humidity: 65%</text>
      <circle cx="228" cy="32" r="5" fill="#E3343F" />
    </g>

    <!-- Telemetry Status Bottom -->
    <g transform="translate(16, 308)">
      <rect width="248" height="80" rx="6" fill="#1F1F22" stroke="#252528" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">SYSTEM HEALTH:</text>
      <text x="12" y="40" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">Free Heap: 184 KB &#8226; WiFi RSSI: -54 dBm</text>
      <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">CPU Freq: 240 MHz &#8226; Uptime: 48h 12m</text>
    </g>
  </g>

  <!-- Right: Browser File Explorer Interface Simulation -->
  <g transform="translate(328, 66)">
    <rect width="440" height="404" rx="8" fill="#141416" stroke="#252528" stroke-width="1" />

    <!-- Browser Address Bar -->
    <rect x="16" y="16" width="408" height="34" rx="4" fill="#0B0B0C" stroke="#252528" stroke-width="1" />
    <circle cx="32" cy="33" r="4" fill="#E3343F" />
    <text x="44" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#858585">http://192.168.1.142/fs/media/lectures</text>
    <text x="410" y="36" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="end">WIFI LAN</text>

    <!-- Storage Usage Meter -->
    <g transform="translate(16, 62)">
      <rect width="408" height="46" rx="6" fill="#1F1F22" stroke="#252528" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">CAPACITY: 14.2 GB USED OF 32.0 GB (44.3%)</text>
      <rect x="12" y="28" width="384" height="6" rx="3" fill="#0B0B0C" />
      <rect x="12" y="28" width="170" height="6" rx="3" fill="#E3343F" />
    </g>

    <!-- File Table Header -->
    <g transform="translate(16, 120)">
      <text x="12" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">FILE NAME</text>
      <text x="260" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">SIZE</text>
      <text x="340" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585">ACTION</text>
      <line x1="0" y1="22" x2="408" y2="22" stroke="#252528" stroke-width="1" />
    </g>

    <!-- File Row 1 -->
    <g transform="translate(16, 154)">
      <rect width="408" height="42" rx="4" fill="#0B0B0C" stroke="#252528" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FFFFFF">dsa_graph_traversal_lecture.mp4</text>
      <text x="12" y="34" font-family="'JetBrains Mono', monospace" font-size="8" fill="#858585">video/mp4 &#8226; HTTP Range Supported</text>
      <text x="260" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#858585">482 MB</text>
      <rect x="336" y="11" width="60" height="20" rx="3" fill="#E3343F" />
      <text x="366" y="24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">STREAM</text>
    </g>

    <!-- File Row 2 -->
    <g transform="translate(16, 206)">
      <rect width="408" height="42" rx="4" fill="#0B0B0C" stroke="#252528" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FFFFFF">pstu_semester_syllabus_2024.pdf</text>
      <text x="12" y="34" font-family="'JetBrains Mono', monospace" font-size="8" fill="#858585">application/pdf &#8226; Direct Download</text>
      <text x="260" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#858585">4.2 MB</text>
      <rect x="336" y="11" width="60" height="20" rx="3" fill="#1F1F22" stroke="#252528" stroke-width="1" />
      <text x="366" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFFFFF" text-anchor="middle">GET</text>
    </g>

    <!-- File Row 3 -->
    <g transform="translate(16, 258)">
      <rect width="408" height="42" rx="4" fill="#0B0B0C" stroke="#252528" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FFFFFF">lab_circuit_diagram_edc.png</text>
      <text x="12" y="34" font-family="'JetBrains Mono', monospace" font-size="8" fill="#858585">image/png &#8226; Fast Render</text>
      <text x="260" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#858585">1.8 MB</text>
      <rect x="336" y="11" width="60" height="20" rx="3" fill="#1F1F22" stroke="#252528" stroke-width="1" />
      <text x="366" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFFFFF" text-anchor="middle">VIEW</text>
    </g>

    <!-- File Upload Target Area (Drag & Drop Zone) -->
    <g transform="translate(16, 312)">
      <rect width="408" height="74" rx="6" fill="#0B0B0C" stroke="#252528" stroke-width="1" stroke-dasharray="4 4" />
      <text x="204" y="36" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DRAG &amp; DROP FILES TO UPLOAD</text>
      <text x="204" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#858585" text-anchor="middle">Multipart POST &#8226; Direct Flash write buffer</text>
    </g>
  </g>
</svg>
