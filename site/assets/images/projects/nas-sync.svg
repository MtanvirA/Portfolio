<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141a24" />
    </linearGradient>
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#d4ff3a" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="500" rx="16" fill="url(#nasBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#222c3d" stroke-width="1.5" />

  <!-- App Header -->
  <rect x="0" y="0" width="800" height="48" rx="16" fill="#10151f" />
  <circle cx="28" cy="24" r="6" fill="#ef4444" />
  <circle cx="48" cy="24" r="6" fill="#f59e0b" />
  <circle cx="68" cy="24" r="6" fill="#10b981" />
  <text x="400" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" text-anchor="middle">NAS Sync Mini Server — ESP32 HTTP File &amp; Media Host</text>

  <!-- Left: ESP32 Hardware Schematic -->
  <g transform="translate(30, 70)">
    <rect width="280" height="400" rx="12" fill="#0f141d" stroke="#223044" stroke-width="1.5" />
    
    <!-- Title banner -->
    <rect x="20" y="18" width="240" height="36" rx="6" fill="#172233" />
    <text x="140" y="41" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">ESP32 EMBEDDED NODE</text>

    <!-- microSD Card Storage Block -->
    <g transform="translate(20, 68)">
      <rect width="240" height="64" rx="8" fill="#151d29" stroke="#25354a" stroke-width="1" />
      <rect x="12" y="14" width="28" height="36" rx="3" fill="#1e293b" stroke="#d4ff3a" stroke-width="1.5" />
      <text x="50" y="30" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#f8fafc">microSD Storage</text>
      <text x="50" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">SPI Interface &#8226; FAT32</text>
      <text x="228" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#d4ff3a" text-anchor="end">32 GB</text>
    </g>

    <!-- 0.96" OLED Simulation -->
    <g transform="translate(20, 144)">
      <rect width="240" height="76" rx="8" fill="#06090e" stroke="#38bdf8" stroke-width="1.2" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">OLED 128x64 SSD1306</text>
      <text x="12" y="36" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f8fafc">IP: 192.168.1.142</text>
      <text x="12" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4ade80">FILES: 128 | USED: 14.2G</text>
      <text x="12" y="68" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">HTTP SERVER: PORT 80</text>
    </g>

    <!-- DHT11 Sensor Block -->
    <g transform="translate(20, 232)">
      <rect width="240" height="56" rx="8" fill="#151d29" stroke="#25354a" stroke-width="1" />
      <circle cx="28" cy="28" r="14" fill="#1a2736" stroke="#14b8a6" stroke-width="1.5" />
      <text x="28" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#14b8a6" text-anchor="middle">DHT</text>
      <text x="54" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#f8fafc">DHT11 Telemetry</text>
      <text x="54" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Temp: 28.4°C | Hum: 62%</text>
    </g>

    <!-- Educational LAN Tag -->
    <g transform="translate(20, 302)">
      <rect width="240" height="42" rx="6" fill="#111823" stroke="#212f42" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">DEPLOYMENT SCOPE</text>
      <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#d4ff3a">LAN / Educational Prototype</text>
    </g>

    <!-- Pin bus connection line -->
    <line x1="260" y1="200" x2="280" y2="200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
  </g>

  <!-- Right: Web File Manager UI -->
  <g transform="translate(330, 70)">
    <rect width="440" height="400" rx="12" fill="#0f141d" stroke="#223044" stroke-width="1.5" />

    <!-- Browser URL Bar -->
    <g transform="translate(20, 16)">
      <rect width="400" height="32" rx="6" fill="#161e2b" stroke="#222f42" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4ade80">&#128274; http://192.168.1.142/nas/storage</text>
    </g>

    <!-- File Explorer Breadcrumb & Actions -->
    <g transform="translate(20, 60)">
      <text x="4" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Path: /sdcard/media/docs/</text>
      <rect x="270" y="2" width="60" height="22" rx="4" fill="#182536" stroke="#293b54" stroke-width="1" />
      <text x="300" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">+ Folder</text>
      <rect x="336" y="2" width="64" height="22" rx="4" fill="#1a3328" stroke="#276344" stroke-width="1" />
      <text x="368" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4ade80" text-anchor="middle">+ Upload</text>
    </g>

    <!-- File Items List -->
    <g transform="translate(20, 94)">
      <!-- Item 1: MP4 Video -->
      <rect width="400" height="36" rx="6" fill="#141c28" stroke="#1f2a3a" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc">&#127916; lecture_03_dsa.mp4</text>
      <text x="280" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">124 MB</text>
      <text x="388" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="end">Stream</text>

      <!-- Item 2: PDF Document -->
      <g transform="translate(0, 42)">
        <rect width="400" height="36" rx="6" fill="#141c28" stroke="#1f2a3a" stroke-width="1" />
        <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc">&#128196; operating_systems_notes.pdf</text>
        <text x="280" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">8.4 MB</text>
        <text x="388" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#d4ff3a" text-anchor="end">View</text>
      </g>

      <!-- Item 3: Audio MP3 -->
      <g transform="translate(0, 84)">
        <rect width="400" height="36" rx="6" fill="#141c28" stroke="#1f2a3a" stroke-width="1" />
        <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc">&#127911; seminar_recording.mp3</text>
        <text x="280" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">32 MB</text>
        <text x="388" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#14b8a6" text-anchor="end">Play</text>
      </g>

      <!-- Item 4: CSV Sensor Log -->
      <g transform="translate(0, 126)">
        <rect width="400" height="36" rx="6" fill="#141c28" stroke="#1f2a3a" stroke-width="1" />
        <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc">&#128202; dht11_environmental_log.csv</text>
        <text x="280" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">420 KB</text>
        <text x="388" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="end">Download</text>
      </g>
    </g>

    <!-- Upload Progress Bar Component -->
    <g transform="translate(20, 270)">
      <rect width="400" height="66" rx="8" fill="#131b26" stroke="#223043" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f8fafc">UPLOADING: embedded_firmware_v2.bin</text>
      <text x="388" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#d4ff3a" text-anchor="end">78% &#8226; 3.8 MB/s</text>
      
      <!-- Progress Bar Track -->
      <rect x="12" y="34" width="376" height="8" rx="4" fill="#0a0e14" />
      <rect x="12" y="34" width="293" height="8" rx="4" fill="url(#progGrad)" />
      <text x="12" y="55" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">ESP32 AsyncWebServer &#8226; Streamed to SD Card via SPI</text>
    </g>

    <!-- Footer Stats -->
    <g transform="translate(20, 350)">
      <rect width="400" height="34" rx="6" fill="#151e2b" />
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Storage: 14.2 GB / 32 GB Used (44%)</text>
      <text x="384" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4ade80" text-anchor="end">&#9679; HTTP Active</text>
    </g>
  </g>
</svg>