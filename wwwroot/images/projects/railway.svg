<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#151b26" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d4ff3a" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="500" rx="16" fill="url(#rBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#222c3d" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="48" rx="16" fill="#10151f" />
  <circle cx="28" cy="24" r="6" fill="#ef4444" />
  <circle cx="48" cy="24" r="6" fill="#f59e0b" />
  <circle cx="68" cy="24" r="6" fill="#10b981" />
  <text x="400" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" text-anchor="middle">Smart Railway Track Health &amp; Signaling Prototype — ESP32 System Schematic</text>

  <!-- Left: ESP32 Microcontroller Node -->
  <rect x="40" y="80" width="280" height="380" rx="12" fill="#0f141d" stroke="#223044" stroke-width="1.5" />
  <rect x="60" y="100" width="240" height="40" rx="6" fill="#172233" />
  <text x="180" y="125" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">ESP32-WROOM-32D</text>

  <!-- Pinouts & Modules -->
  <g transform="translate(60, 160)">
    <!-- Ultrasonic Sensor -->
    <rect width="240" height="56" rx="6" fill="#151d29" stroke="#25354a" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="58" cy="28" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="86" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#f1f5f9">HC-SR04 Radar</text>
    <text x="86" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Obstacle &amp; Speed Pulse</text>
    <text x="225" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4ade80" text-anchor="end">READY</text>
  </g>

  <g transform="translate(60, 230)">
    <!-- 0.96 OLED Screen -->
    <rect width="240" height="70" rx="6" fill="#080c12" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">TRACK: SEC-04 ACTIVE</text>
    <text x="15" y="40" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#d4ff3a">SPEED: 42.5 km/h</text>
    <text x="15" y="58" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4ade80">CLEAR: 120m AHEAD</text>
  </g>

  <g transform="translate(60, 316)">
    <!-- Buzzer & Signal LEDs -->
    <rect width="240" height="56" rx="6" fill="#151d29" stroke="#25354a" stroke-width="1" />
    <circle cx="30" cy="28" r="8" fill="#ef4444" opacity="0.3" />
    <circle cx="54" cy="28" r="8" fill="#eab308" opacity="0.3" />
    <circle cx="78" cy="28" r="8" fill="#22c55e" />
    <text x="100" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#f1f5f9">Auto Signal Relay</text>
    <text x="100" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Buzzer PWM + Tri-LED</text>
  </g>

  <g transform="translate(60, 390)">
    <rect width="240" height="48" rx="6" fill="#182333" />
    <text x="120" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Academic Benchmark Model</text>
    <text x="120" y="36" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">Not Certified for Railway Transit</text>
  </g>

  <!-- Right: Schematic Track Visual -->
  <rect x="350" y="80" width="410" height="380" rx="12" fill="#0f141d" stroke="#223044" stroke-width="1.5" />

  <!-- Railway Track Representation -->
  <line x1="390" y1="260" x2="720" y2="260" stroke="#475569" stroke-width="8" />
  <line x1="390" y1="310" x2="720" y2="310" stroke="#475569" stroke-width="8" />
  
  <!-- Ties / Sleepers -->
  <line x1="410" y1="248" x2="410" y2="322" stroke="#334155" stroke-width="6" />
  <line x1="450" y1="248" x2="450" y2="322" stroke="#334155" stroke-width="6" />
  <line x1="490" y1="248" x2="490" y2="322" stroke="#334155" stroke-width="6" />
  <line x1="530" y1="248" x2="530" y2="322" stroke="#334155" stroke-width="6" />
  <line x1="570" y1="248" x2="570" y2="322" stroke="#334155" stroke-width="6" />
  <line x1="610" y1="248" x2="610" y2="322" stroke="#334155" stroke-width="6" />
  <line x1="650" y1="248" x2="650" y2="322" stroke="#334155" stroke-width="6" />
  <line x1="690" y1="248" x2="690" y2="322" stroke="#334155" stroke-width="6" />

  <!-- Ultrasonic Detection Wave -->
  <path d="M 430 230 A 40 40 0 0 1 430 150" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 470 240 A 70 70 0 0 1 470 140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5" />
  <path d="M 520 250 A 100 100 0 0 1 520 130" fill="none" stroke="#d4ff3a" stroke-width="2.5" />

  <text x="560" y="160" font-family="'JetBrains Mono', monospace" font-size="11" fill="#d4ff3a">Obstacle Range Scan</text>
  <text x="560" y="178" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Transit Time: &Delta;t = 2d / c</text>

  <!-- Metric Badges -->
  <rect x="380" y="370" width="160" height="60" rx="8" fill="#151d29" stroke="#223044" stroke-width="1" />
  <text x="395" y="392" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">TRANSIT VELOCITY</text>
  <text x="395" y="416" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">v = &Delta;x / &Delta;t</text>

  <rect x="560" y="370" width="170" height="60" rx="8" fill="#151d29" stroke="#223044" stroke-width="1" />
  <text x="575" y="392" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">FIRMWARE PROTOCOL</text>
  <text x="575" y="416" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#38bdf8">C++ / ESP-IDF</text>
</svg>
