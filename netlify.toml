# Netlify Configuration for Md. Tanvir Anjum Static Portfolio
# Target: Netlify Free Tier ($0/month)
# Publishes ONLY the static site/ directory.
# The ASP.NET Core MVC application remains untouched in root for learning.

[build]
  command = "npm ci && npm run build:static-css"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

# Security & Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.netlify.app https://mtanviranjum.tech;"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Clean directory-based URL handling
[[redirects]]
  from = "/projects"
  to = "/projects/"
  status = 301

[[redirects]]
  from = "/projects/sharesync"
  to = "/projects/sharesync/"
  status = 301

[[redirects]]
  from = "/projects/railway-track-health-monitoring"
  to = "/projects/railway-track-health-monitoring/"
  status = 301

[[redirects]]
  from = "/projects/campussync"
  to = "/projects/campussync/"
  status = 301

[[redirects]]
  from = "/projects/nas-sync-mini-server"
  to = "/projects/nas-sync-mini-server/"
  status = 301

[[redirects]]
  from = "/projects/student-enrollment-system"
  to = "/projects/student-enrollment-system/"
  status = 301

# Custom 404 routing
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
